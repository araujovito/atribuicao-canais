[project]
name = "atribuicao-canais"
version = "0.1.0"
description = "De onde vêm os clientes e qual canal merece o crédito: coleta, junção entre aparelhos e atribuição multicanal com LGPD"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.2,<4",
    "starlette>=1.8.0",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Começa pelas falhas com impacto funcional e pelas armadilhas comuns. O
# estilo existente pode ser migrado gradualmente sem bloquear o CI inteiro.
select = ["E9", "F63", "F7", "F82", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
