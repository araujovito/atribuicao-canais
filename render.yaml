# Blueprint do Render: Dashboard → New → Blueprint → apontar para o repositório.
# Configure DATABASE_URL com a conexão do PostgreSQL no painel do serviço.
services:
  - type: web
    name: atribuicao-canais
    runtime: python
    plan: free
    buildCommand: pip install uv==0.12.18 && uv sync --locked --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.3"
      # Segredos sorteados pelo Render na criação; ficam no painel do serviço.
      - key: ATRIBUICAO_CHAVE_HMAC
        generateValue: true
      - key: ATRIBUICAO_TOKEN_ADMIN
        generateValue: true
      # O Render fica na frente do app como proxy: o IP real vem no
      # X-Forwarded-For (ver app/limite.py).
      - key: ATRIBUICAO_ATRAS_DE_PROXY
        value: "1"
      - key: ATRIBUICAO_GERAR_DEMO
        value: "1"
      - key: DATABASE_URL
        sync: false
